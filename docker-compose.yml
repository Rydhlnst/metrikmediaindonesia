services:
  # ==============================================================================
  # 1. Next.js Web Application
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    container_name: metrikmedia-app
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:?NODE_ENV is required}
      - DATABASE_TYPE=${DATABASE_TYPE:-postgresql}
      - POSTGRES_URL=${POSTGRES_URL:?POSTGRES_URL is required}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - MINIO_BUCKET=${MINIO_BUCKET:?MINIO_BUCKET is required}
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:?TRUST_PROXY_HEADERS is required}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EDITORIAL_EMAIL=${EDITORIAL_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 2. PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: metrikmedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 3. Redis In-Memory Cache
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: metrikmedia-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 4. MinIO Object Storage (S3 Compatible)
  # ==============================================================================
  minio:
    image: minio/minio:latest
    container_name: metrikmedia-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 5. MinIO Auto-Bucket & Public Read Initializer
  # ==============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: metrikmedia-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}; do
        echo 'MinIO is initializing, retrying in 2 seconds...';
        sleep 2;
      done;
      echo 'Ensuring bucket exists...';
      /usr/bin/mc mb --ignore-existing myminio/$${MINIO_BUCKET:-metrikmedia};
      echo 'Setting public download policy...';
      /usr/bin/mc anonymous set download myminio/$${MINIO_BUCKET:-metrikmedia};
      echo 'MinIO initialization complete!';
      exit 0;
      "
    networks:
      - metrikmedia-net

  # ============================================================================
  # 6. Repeatable Database Migration Runner
  # ============================================================================
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
    container_name: metrikmedia-db-migrate
    restart: "no"
    environment:
      DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metrikmedia-net

  # ==============================================================================
  # ============================================================================
  # 6b. Idempotent Editorial Demo Seed
  # ============================================================================
  db-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
    container_name: metrikmedia-db-seed
    restart: "no"
    command: ["pnpm", "db:seed:news"]
    environment:
      DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - metrikmedia-net

  # 7. Caddy Reverse Proxy (Auto Let's Encrypt SSL)
  # ==============================================================================
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: metrikmedia-caddy:local
    container_name: metrikmedia-caddy
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN is required}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 8. Cron Scheduler (Scheduled Publishing + Author Milestones)
  # ==============================================================================
  cron:
    image: alpine:3.19
    container_name: metrikmedia-cron
    restart: unless-stopped
    entrypoint: /bin/sh
    command: ["/app/cron-runner.sh"]
    environment:
      - APP_URL=http://app:3000
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
    volumes:
      - ./cron-runner.sh:/app/cron-runner.sh:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 9. pgAdmin (Database GUI - Optional Profile)
  # ==============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: metrikmedia-pgadmin
    profiles:
      - tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.invalid}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_before_enabling_tools}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metrikmedia-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  metrikmedia-net:
    driver: bridge
