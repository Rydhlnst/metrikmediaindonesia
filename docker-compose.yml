services:
  # ==============================================================================
  # 1. Next.js Web Application
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
    container_name: metrikmedia-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_TYPE=${DATABASE_TYPE:-postgresql}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local_postgres_password}@postgres:5432/${POSTGRES_DB:-metrikmedia}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-local_minio_password}
      - MINIO_BUCKET=${MINIO_BUCKET:-metrikmedia}
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_better_auth_secret_change_me}
      - CRON_SECRET=${CRON_SECRET:-local_cron_secret_change_me}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EDITORIAL_EMAIL=${EDITORIAL_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 2. PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: metrikmedia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metrikmedia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-metrikmedia}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 3. Redis In-Memory Cache
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: metrikmedia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 4. MinIO Object Storage (S3 Compatible)
  # ==============================================================================
  minio:
    image: minio/minio:latest
    container_name: metrikmedia-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_minio_password}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 5. MinIO Auto-Bucket & Public Read Initializer
  # ==============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: metrikmedia-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-metrikmedia}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}; do
        echo 'MinIO is initializing, retrying in 2 seconds...';
        sleep 2;
      done;
      echo 'Ensuring bucket exists...';
      /usr/bin/mc mb --ignore-existing myminio/$${MINIO_BUCKET:-metrikmedia};
      echo 'Setting public download policy...';
      /usr/bin/mc anonymous set download myminio/$${MINIO_BUCKET:-metrikmedia};
      echo 'MinIO initialization complete!';
      exit 0;
      "
    networks:
      - metrikmedia-net

  # ============================================================================
  # 6. Repeatable Database Migration Runner
  # ============================================================================
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
    container_name: metrikmedia-db-migrate
    restart: "no"
    environment:
      DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local_postgres_password}@postgres:5432/${POSTGRES_DB:-metrikmedia}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 7. Caddy Reverse Proxy (Auto Let's Encrypt SSL)
  # ==============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: metrikmedia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 8. Cron Scheduler (Scheduled Publishing + Author Milestones)
  # ==============================================================================
  cron:
    image: alpine:3.19
    container_name: metrikmedia-cron
    restart: unless-stopped
    entrypoint: /bin/sh
    command: ["/app/cron-runner.sh"]
    environment:
      - APP_URL=http://app:3000
      - CRON_SECRET=${CRON_SECRET:-local_cron_secret_change_me}
    volumes:
      - ./cron-runner.sh:/app/cron-runner.sh:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - metrikmedia-net

  # ==============================================================================
  # 9. pgAdmin (Database GUI - Optional Profile)
  # ==============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: metrikmedia-pgadmin
    profiles:
      - tools
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@metrikmediaindonesia.id
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metrikmedia-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  metrikmedia-net:
    driver: bridge
