services:
  # ============================================
  # PostgreSQL (Default)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: metrikmedia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: metrikmedia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrikmedia"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # MySQL (Optional - uncomment to use)
  # ============================================
  # mysql:
  #   image: mysql:8.0
  #   container_name: metrikmedia-mysql
  #   restart: unless-stopped
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: metrikmedia
  #     MYSQL_USER: admin
  #     MYSQL_PASSWORD: admin
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # ============================================
  # MinIO (Object Storage)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: metrikmedia-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ============================================
  # pgAdmin (Optional - PostgreSQL GUI)
  # ============================================
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: metrikmedia-pgadmin
  #   restart: unless-stopped
  #   ports:
  #     - "5050:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@metrikmedia.id
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  # mysql_data:
